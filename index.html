<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نظام رباط</title><style>body{font-family:Arial,Tahoma;margin:0;background:#f4f6f8;color:#172033}.top{background:#172033;color:#fff;padding:20px}.wrap{max-width:900px;margin:30px auto;padding:15px}.card{background:#fff;padding:24px;border-radius:14px;box-shadow:0 5px 20px #0001;margin-bottom:18px}input,select,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:9px;font-size:15px}button{background:#172033;color:#fff;cursor:pointer}.hide{display:none}.ok{color:#16703a}.err{color:#a11}</style></head>
<body><div class="top"><b>مجموعة رباط الخدمية</b><br><small>Ribat System</small></div><main class="wrap">
<section id="login" class="card"><h2>تسجيل الدخول</h2><input id="u" placeholder="اسم المستخدم"><input id="p" type="password" placeholder="كلمة المرور"><button onclick="login()">دخول</button><p id="m"></p><small>الدخول الأول: admin / Ribat@123</small></section>
<section id="app" class="hide"><div class="card"><h2>لوحة التحكم</h2><p>مرحباً <b id="who"></b></p><p id="server">جاري فحص الخادم...</p><button onclick="logout()">تسجيل الخروج</button></div>
<div id="manage" class="card"><h3>إضافة مستخدم</h3><input id="nu" placeholder="اسم المستخدم"><input id="np" type="password" placeholder="كلمة المرور"><select id="nr"><option value="staff">موظف</option><option value="manager">مدير</option></select><button onclick="addUser()">إضافة</button><p id="um"></p><div id="list"></div></div></section></main>
<script>const API='https://ribat-system.onrender.com';let users=JSON.parse(localStorage.getItem('ribat_users')||'[]'),s=JSON.parse(localStorage.getItem('ribat_session')||'null');if(!users.length){users=[{username:'admin',password:'Ribat@123',role:'manager'}];localStorage.setItem('ribat_users',JSON.stringify(users))}function login(){let u=document.getElementById('u').value,p=document.getElementById('p').value,x=users.find(a=>a.username===u&&a.password===p);if(!x){document.getElementById('m').className='err';document.getElementById('m').textContent='بيانات الدخول غير صحيحة';return}s={username:x.username,role:x.role};localStorage.setItem('ribat_session',JSON.stringify(s));show()}function show(){login.classList.add('hide');app.classList.remove('hide');who.textContent=s.username;manage.classList.toggle('hide',s.role!=='manager');render()}function logout(){localStorage.removeItem('ribat_session');location.reload()}function addUser(){if(s.role!=='manager')return;let u=nu.value.trim(),p=np.value,r=nr.value;if(!u||!p){um.textContent='أكمل البيانات';return}if(users.some(x=>x.username===u)){um.textContent='اسم المستخدم موجود';return}users.push({username:u,password:p,role:r});localStorage.setItem('ribat_users',JSON.stringify(users));nu.value=np.value='';um.className='ok';um.textContent='تمت الإضافة بنجاح';render()}function render(){list.innerHTML=users.map(x=>'<p>👤 '+x.username+' — '+(x.role==='manager'?'مدير':'موظف')+'</p>').join('')}fetch(API).then(r=>server.textContent=r.ok?'الخادم متصل ✓':'الخادم يستجيب').catch(()=>server.textContent='تعذر الاتصال بالخادم');if(s)show()</script></body></html>
