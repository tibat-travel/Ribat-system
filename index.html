<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نظام رباط</title><style>body{font-family:Arial,Tahoma;background:#f4f6f9;margin:0;color:#172033}.top{background:#172033;color:#fff;padding:20px}.wrap{max-width:700px;margin:50px auto;padding:20px}.card{background:#fff;padding:25px;border-radius:15px;box-shadow:0 5px 20px #0001}input,button,select{width:100%;padding:13px;margin:8px 0;box-sizing:border-box;border-radius:9px;border:1px solid #ddd}button{background:#172033;color:white;border:0;font-weight:bold;cursor:pointer}.hide{display:none}.err{color:#a00;background:#fee;padding:10px;border-radius:8px}.ok{color:#063;background:#efe;padding:10px;border-radius:8px}</style></head><body><div class="top"><b>مجموعة رباط الخدمية</b><br><small>Ribat Travel & Tourism — Ribat System</small></div><div class="wrap"><div id="login" class="card"><h2>تسجيل الدخول</h2><label>اسم المستخدم</label><input id="u" value="admin"><label>كلمة المرور</label><input id="p" type="password"><button onclick="login()">دخول</button><div id="m"></div></div><div id="app" class="card hide"><h2>لوحة تحكم نظام رباط</h2><p>مرحباً <b>admin</b> — أنت المدير</p><hr><h3>إضافة مستخدم</h3><input id="nu" placeholder="اسم المستخدم"><input id="np" type="password" placeholder="كلمة المرور"><select id="nr"><option value="staff">موظف</option><option value="manager">مدير</option></select><button onclick="add()">إضافة المستخدم</button><div id="am"></div><h3>المستخدمون</h3><div id="list"></div><button onclick="logout()">تسجيل الخروج</button></div></div><script>const U='admin',P='Ribat@123';let users=JSON.parse(localStorage.getItem('ribat_users')||'[]');if(!users.some(x=>x.u===U)){users.unshift({u:U,p:P,r:'manager'});localStorage.setItem('ribat_users',JSON.stringify(users));}function login(){let u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;if(u===U&&p===P){localStorage.setItem('ribat_session','1');open();return}let x=users.find(a=>a.u===u&&a.p===p);if(x){localStorage.setItem('ribat_session','1');open()}else document.getElementById('m').innerHTML='<div class="err">بيانات الدخول غير صحيحة</div>'}function open(){document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');render()}function add(){let u=document.getElementById('nu').value.trim(),p=document.getElementById('np').value,r=document.getElementById('nr').value;if(!u||!p){document.getElementById('am').innerHTML='<div class="err">أدخل البيانات كاملة</div>';return}if(users.some(x=>x.u===u)){document.getElementById('am').innerHTML='<div class="err">اسم المستخدم موجود</div>';return}users.push({u,p,r});localStorage.setItem('ribat_users',JSON.stringify(users));document.getElementById('am').innerHTML='<div class="ok">تمت إضافة المستخدم</div>';render()}function render(){document.getElementById('list').innerHTML=users.map(x=>'<p>'+x.u+' — '+(x.r==='manager'?'مدير':'موظف')+'</p>').join('')}function logout(){localStorage.removeItem('ribat_session');location.reload()}if(localStorage.getItem('ribat_session'))open();</script></body></html>
